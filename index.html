<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24時間カレンダー</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #ffffff;
      color: #333;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    #status {
      color: #666;
      margin-bottom: 24px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      background: #333;
      color: white;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>24時間カレンダー</h1>

    <p id="status">Firebaseを準備しています……</p>

    <button id="loginButton">Googleでログイン</button>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithRedirect,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyABVnYnWb6ZrSkDHL3SRWamVfijipEXaZ4",
      authDomain: "hour-calendar.firebaseapp.com",
      projectId: "hour-calendar",
      storageBucket: "hour-calendar.firebasestorage.app",
      messagingSenderId: "794693851609",
      appId: "1:794693851609:web:bfb3d9bfde7b0f91bde1c8",
      measurementId: "G-JH07NRG6KR"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();

    const loginButton = document.getElementById("loginButton");
    const status = document.getElementById("status");


    loginButton.addEventListener("click", async () => {
      try {
        status.textContent = "Googleログイン画面を開いています……";

        await signInWithRedirect(auth, provider);

      } catch (error) {
        console.error(error);

        status.textContent =
          "ログインに失敗しました。設定を確認してください。";
      }
    });


    onAuthStateChanged(auth, (user) => {
      if (user) {
        status.textContent =
          `ログイン中：${user.displayName || user.email}`;

        loginButton.style.display = "none";
      } else {
        status.textContent =
          "Googleアカウントでログインしてください。";
      }
    });
  </script>
</body>
</html>
