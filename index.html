<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24時間カレンダー</title>
</head>

<body>

  <h1>24時間カレンダー</h1>

  <p id="status">準備中……</p>

  <button id="loginButton">Googleでログイン</button>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyABVnYnWb6ZrSkDHL3SRWamVfijipEXaZ4",
      authDomain: "hour-calendar.firebaseapp.com",
      projectId: "hour-calendar",
      storageBucket: "hour-calendar.firebasestorage.app",
      messagingSenderId: "794693851609",
      appId: "1:794693851609:web:bfb3d9bfde7b0f91bde1c8",
      measurementId: "G-JH07NRG6KR"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();

    const button = document.getElementById("loginButton");

    const status = document.getElementById("status");


    button.addEventListener("click", async () => {

      status.textContent = "ログインしています……";

      try {

        const result = await signInWithPopup(auth, provider);

        status.textContent =
          "ログイン成功！ " +
          (result.user.displayName || result.user.email);

        button.style.display = "none";

      } catch (error) {

        console.error(error);

        status.textContent =
          "エラー：" + error.code;

        alert(
          "ログインエラー\n\n" +
          error.code + "\n\n" +
          error.message
        );

      }

    });


    onAuthStateChanged(auth, (user) => {

      if (user) {

        status.textContent =
          "ログイン中：" +
          (user.displayName || user.email);

        button.style.display = "none";

      }

    });

  </script>

</body>
</html>
